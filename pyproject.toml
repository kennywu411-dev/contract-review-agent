[project]
name = "docpilot"
version = "0.0.1"
description = "DocPilot：高校规章可信问答 agent（逐句出处、查不到就拒答）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.142,<3",
    "numpy>=2",
    "pypdf>=6.21",
    "torch>=2.8",
    "transformers>=5",
]

[project.scripts]
docpilot = "docpilot.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: 需要下载的真模型"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
